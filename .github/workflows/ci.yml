name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # No go.sum exists — this module has zero external
          # dependencies (see go.mod) — so cache-dependency-path must
          # be set explicitly or setup-go silently skips caching
          # (with an annoying "supported file pattern: go.sum"
          # warning) on every run. go.mod still exists and rarely
          # changes, so it's a fine cache key for the build cache.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # Config lives in .golangci.yml — gosec (security), bodyclose,
      # plus golangci-lint's own "standard" set (errcheck, staticcheck,
      # govet, ineffassign, unused, gosimple). gofmt is enforced
      # separately above, not duplicated here.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Manages its own Go toolchain internally — check-latest: true
      # matters here specifically: this module has zero third-party
      # dependencies (see go.mod), so every finding this can plausibly
      # report is a standard-library CVE fixed in a newer Go patch
      # release, not something a code change here can fix. Always
      # scanning under the latest available patch is what keeps this
      # signal meaningful instead of permanently red for a fix that
      # already shipped upstream.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
