name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # For the sqlstore coverage step below: see the sqlstore job.
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: sqlstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow clone — SonarQube's own
          # recommendation, for accurate blame/new-code-period data on
          # the scan step below.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # No go.sum exists — this module has zero external
          # dependencies (see go.mod) — so cache-dependency-path must
          # be set explicitly or setup-go silently skips caching
          # (with an annoying "supported file pattern: go.sum"
          # warning) on every run. go.mod still exists and rarely
          # changes, so it's a fine cache key for the build cache.
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -coverpkg=./..., not the bare default: Go's default coverage only
      # credits a package for lines exercised by its OWN _test.go files,
      # not lines exercised indirectly through another package's tests
      # (e.g. server's own integration-style tests driving resource/ and
      # the root fapigo package) — verified locally: this raises the
      # root package from 88.7%->96.3%, resource from 91.5%->96.6%, and
      # internal/token from 79.6%->83.4%, with everything else moving
      # ≤1pt. A smaller effect than the same fix had in a sibling
      # project (where one package was reporting 0% despite being
      # genuinely well-tested via other packages' suites) — go-fapi's
      # packages are each fairly thoroughly unit-tested on their own
      # already — but it's still a real accuracy gap in what SonarQube
      # and Codecov (both fed by coverage.out below) report.
      - name: go test (race)
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # sqlstore/ is a module of its own, so the run above never covers
      # it. Its coverage, against SQLite and the service container's
      # PostgreSQL, goes to SonarQube and Codecov beside coverage.out
      # (sonar.go.coverage.reportPaths). The sqlstore job below is the
      # module's own gate; this run only measures.
      - name: go test sqlstore (coverage)
        working-directory: sqlstore
        env:
          FAPIGO_SQLSTORE_POSTGRES_DSN: postgres://postgres:sqlstore@localhost:5432/postgres?sslmode=disable
        run: go test -coverprofile=coverage.out ./...

      # Uploads the same coverage.out the step above already produced —
      # a second, independent coverage view (trend graphs, per-PR diff
      # comments, the README badge) alongside SonarQube's own gate
      # below, not a replacement for it. CODECOV_TOKEN is a repo secret
      # from codecov.io's own repo settings (Settings > General >
      # Repository Upload Token), after enabling this repo there.
      - name: Codecov upload
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,sqlstore/coverage.out
          fail_ci_if_error: false

      # A second run, in Go's own -json event format rather than
      # coverage.out, purely for SonarQube's test-execution reporting
      # (pass/fail/skip counts and duration — see
      # sonar.go.tests.reportPaths in sonar-project.properties) — a
      # distinct signal from coverage, which the step above already
      # covers. Not folded into one invocation: `go test -json` encodes
      # the ordinary human-readable output (including the per-package
      # coverage summary above) as JSON events instead, which would
      # make this job's own log far harder to skim.
      #
      # Its output goes only to report.json, so a test that fails here
      # but passed in the run above (a flaky one) would otherwise fail
      # the step without naming itself. On failure, name each failing
      # test and package as an annotation and print their output.
      - name: go test (json, for SonarQube test reporting)
        run: |
          status=0
          go test -race ./... -json > report.json || status=$?
          if [ "$status" -ne 0 ]; then
            jq -r 'select(.Action == "fail" and .Test != null) | "::error title=Test failed::\(.Package) \(.Test)"' report.json
            jq -r 'select(.Action == "fail" and .Test == null and .Package != null) | "::error title=Package failed::\(.Package)"' report.json | sort -u
            echo "::group::Output of the failing tests and packages"
            jq -jrs '
              [ .[] | select(.Action == "fail") | {p: .Package, t: (.Test // "")} ] as $failed
              | .[]
              | select((.Action == "output" and ({p: .Package, t: (.Test // "")} as $k | any($failed[]; . == $k)))
                       or .Action == "build-output")
              | .Output' report.json
            echo "::endgroup::"
          fi
          exit "$status"

      # Config lives in sonar-project.properties (organization,
      # projectKey, sonar.go.coverage.reportPaths=coverage.out — the
      # file the step above just produced). CI-based analysis, not
      # SonarCloud's own Automatic Analysis — the latter never runs
      # this repo's tests, so it can't see coverage at all; that's the
      # whole reason this step exists.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # GitHub gives a pull request from a fork no secrets, so the
        # scan can only fail there ("Not authorized") and would fail
        # this required job on every outside contribution. Skip it for
        # those; pushes, internal and Dependabot pull requests still scan.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

  # sqlstore/ is its own Go module, so the library takes no database
  # driver: every store contract against SQLite and, in the service
  # container, PostgreSQL (FAPIGO_SQLSTORE_POSTGRES_DSN, which the tests
  # require under CI rather than skip), with -race. govulncheck.yml
  # scans it too.
  sqlstore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqlstore
    services:
      postgres:
        # Pinned by digest. Dependabot doesn't update service images:
        # move it by hand (and the test job's copy above).
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: sqlstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      FAPIGO_SQLSTORE_POSTGRES_DSN: postgres://postgres:sqlstore@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sqlstore/go.mod
          check-latest: true
          cache-dependency-path: sqlstore/go.sum

      - name: go vet
        run: go vet ./...

      # Its module path sits under the library's, so Go would let it
      # import the library's internal packages, which a release of it
      # built against a FAPIgo release mustn't depend on.
      - name: public API only
        run: |
          internal=$(go list -f '{{range .Imports}}{{.}} {{end}}{{range .TestImports}}{{.}} {{end}}{{range .XTestImports}}{{.}} {{end}}' ./... | tr ' ' '\n' | grep '^github.com/idfoundry/fapigo/internal' || true)
          if [ -n "$internal" ]; then
            echo "sqlstore must use FAPIgo's public API only; found: $internal"
            exit 1
          fi

      - name: go test (race, SQLite and PostgreSQL)
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: sqlstore

      # go.mod's replace builds against this checkout, but a consumer of
      # a released sqlstore gets the FAPIgo version go.mod requires (a
      # dependency's replace is ignored). Test against exactly that, so
      # sqlstore never relies on FAPIgo API that isn't released yet: a
      # change needing new API waits for the FAPIgo release that has it,
      # then raises the requirement.
      - name: go test against the required FAPIgo release
        run: |
          go mod edit -dropreplace github.com/idfoundry/fapigo
          GOFLAGS=-mod=mod go test ./...

  # Every other job runs go.mod's own minimum Go version (exactly, via
  # go-version-file), which is what keeps that minimum honest — but it
  # means nothing ever builds or tests this module on the newest Go
  # release, the one most consumers are actually on. This job does:
  # vet and the race-enabled test suite on the latest stable Go, to
  # catch a newer compiler or standard library breaking this module
  # before a consumer reports it. GOTOOLCHAIN=local keeps the go command
  # from switching to any other toolchain, so the version under test is
  # exactly the one setup-go installed. Coverage and SonarQube stay on
  # the test job above; running them twice would add nothing.
  test-latest-go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.mod

      - name: go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

  # 32-bit platforms, where int is 32 bits: a constant or a conversion
  # that assumes 64-bit int (math.MaxUint32 compared with an int, say)
  # doesn't even compile there, and every 64-bit job would miss it. Go
  # builds for 32-bit Android (armeabi-v7a, x86) depend on this module.
  # 386 runs natively on the runner, so its tests run; arm is vetted
  # (which builds every package, tests included).
  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: go vet (GOARCH=arm)
        run: GOARCH=arm go vet ./...

      - name: go test (GOARCH=386)
        run: GOARCH=386 go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # fuzz.yml lists its targets by hand, and a target missing there
      # still passes here (go test runs its seeds) without ever being
      # fuzzed, so a mismatch fails this job instead.
      - name: Check fuzz.yml lists every fuzz target
        run: .github/scripts/check-fuzz-matrix.sh

      # Config lives in .golangci.yml — gosec (security), bodyclose,
      # plus golangci-lint's own "standard" set (errcheck, staticcheck,
      # govet, ineffassign, unused, gosimple). gofmt is enforced
      # separately above, not duplicated here.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  # Each example, and the demokit package they share, is its own Go
  # module (building against this checkout through replace directives),
  # so the jobs above never see them. This keeps each one compiling,
  # linted and passing its end-to-end tests as the library changes
  # underneath it.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [examples/internal/demokit, examples/federated-union, examples/decoupled-checkout, examples/payment-consent, examples/payroll-run, examples/identity-check, examples/linked-accounts]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: go vet
        run: go vet ./...

      # An example's module path sits under the library's, so Go would
      # let it import the library's internal packages — which a real
      # integrator can't. Keep examples to the public API.
      - name: public API only
        run: |
          internal=$(go list -f '{{range .Imports}}{{.}} {{end}}{{range .TestImports}}{{.}} {{end}}{{range .XTestImports}}{{.}} {{end}}' ./... | tr ' ' '\n' | grep '^github.com/idfoundry/fapigo/internal' || true)
          if [ -n "$internal" ]; then
            echo "examples must use FAPIgo's public API only; found: $internal"
            exit 1
          fi

      - name: go test (race)
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}
