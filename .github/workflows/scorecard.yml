# Runs the OpenSSF Scorecard (https://scorecard.dev) on main: weekly,
# on every push, and when branch protection changes. Results are
# published to the public Scorecard API (behind the README badge) and
# uploaded as code scanning alerts (Security tab). Follows
# ossf/scorecard-action's own template; publish_results requires the
# job's permissions to stay exactly as they are, and its steps to use
# only the actions it allows.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]

# Read-only by default; the job below grants itself exactly what it
# needs.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish_results: sign the published results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
