name: Interop

# Runs an independent client implementation, openid-client (Node.js),
# through complete FAPI 2.0 flows against cmd/conformance-as: PAR + PKCE
# + private_key_jwt + DPoP, mTLS, message signing (JAR + JARM),
# client_credentials, and CIBA poll and ping. See interop/README.md for
# the legs, the pinned versions and the triage rule when one fails.
#
# The client's version only moves when Dependabot bumps
# interop/openid-client's lockfile, so a weekly run (Sunday 10am UTC,
# after mutation.yml's 9am run) mostly re-checks the server side; it
# also runs on demand, and on a pull request that changes the suite or
# the server it drives.
#
# Informational only: not a required check in branch protection.

on:
  schedule:
    - cron: '0 10 * * 0' # weekly, Sunday 10am UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - interop/**
      - .github/workflows/interop.yml
      - cmd/conformance-as/**
      # The oidc-provider suite's driver builds against FAPIgo's client
      # package and everything it imports.
      - '*.go'
      - go.mod
      - client/**
      - extension/**
      - fapihttp/**
      - federation/**
      - internal/**
      - keys/**
      - storage/**

permissions:
  contents: read

jobs:
  openid-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # See ci.yml: no go.sum at the root.
          cache-dependency-path: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      # The runner installs the harness with `npm ci` (the lockfile, never
      # a fresh resolve) and runs every leg.
      - name: Run the openid-client legs
        run: ./interop/run-openid-client.sh

  # A second, independent client in a second language: huskarl (Rust),
  # on the same server configuration (interop/openid-client/setup.mjs
  # writes it, so Node.js is needed for that script only). The toolchain
  # is pinned here; huskarl and every other crate by interop/huskarl's
  # Cargo.toml and Cargo.lock, built with `cargo build --locked`.
  huskarl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # See ci.yml: no go.sum at the root.
          cache-dependency-path: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      # dtolnay/rust-toolchain publishes no release tags, only the moving
      # v1 tag: pinned by SHA, with the Rust version pinned explicitly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: interop/huskarl

      - name: Run the huskarl legs
        run: ./interop/run-huskarl.sh

  # The other direction: FAPIgo's client package (interop/fapigo-client)
  # drives the same kinds of flows against oidc-provider (Node.js), an
  # independent FAPI 2.0 authorization server. See interop/README.md.
  oidc-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interop/fapigo-client/go.mod
          check-latest: true
          cache-dependency-path: interop/fapigo-client/go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      # The driver's module path sits under the library's, so Go would
      # let it import the library's internal packages, which a real
      # integrator can't. Keep it to the public API, as ci.yml does for
      # examples/.
      - name: public API only
        working-directory: interop/fapigo-client
        run: |
          internal=$(go list -f '{{range .Imports}}{{.}} {{end}}' ./... | tr ' ' '\n' | grep '^github.com/idfoundry/fapigo/internal' || true)
          if [ -n "$internal" ]; then
            echo "interop/fapigo-client must use FAPIgo's public API only; found: $internal"
            exit 1
          fi

      # The runner installs the provider with `npm ci` (the lockfile,
      # never a fresh resolve) and runs every leg.
      - name: Run the FAPIgo client legs against oidc-provider
        run: ./interop/run-oidc-provider.sh

  # FAPIgo's client package (interop/fapigo-client) against a second
  # independent authorization server: Keycloak (Java), run with Docker
  # from the image interop/keycloak/Dockerfile pins (tag and digest).
  # See interop/README.md.
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interop/fapigo-client/go.mod
          check-latest: true
          cache-dependency-path: interop/fapigo-client/go.mod

      # setup.mjs and harness.mjs need Node.js only, no npm packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      - name: Run the FAPIgo client legs against Keycloak
        run: ./interop/run-keycloak.sh
