sonar.organization=idfoundry
sonar.projectKey=IDFoundry_FAPIgo

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Without this, Sonar's Go sensor scans _test.go files as ordinary
# source needing coverage — since go test's own coverage.out never
# contains an entry for a test file itself (only the code it
# exercises), every test file then scores a guaranteed 0%, inflating
# the coverage denominator by roughly the size of this repo's own test
# suite (close to 1:1 with non-test code — see GETTING_STARTED.md/scc).
# Confirmed via the SonarCloud API before this fix: individual _test.go
# files (e.g. resource/verify_test.go) reported non-zero
# lines_to_cover, 0.0% coverage.
sonar.exclusions=**/*_test.go,storage/contract.go
# storage/contract.go is a reusable contract test suite (see its own
# doc comment and ARCHITECTURE.md design rule 13) that a downstream (or
# first-party) storage implementation imports and runs against its own
# factory — it is test code in every sense except its filename, which
# can't end in _test.go because Go doesn't allow importing another
# package's _test.go files. Left unexcluded, it was scoring 27 separate
# go:S1192 "duplicated string literal" findings (mostly repeated fixture
# values like key/subject names across otherwise-independent test
# scenarios) — exactly the kind of noise the **/*_test.go exclusion
# above exists to avoid, just for a file that can't use that suffix.

# Populated by ci.yml's `test` job (go test -race -coverprofile=coverage.out
# ./...) before the SonarQube scan step runs — the native Go cover-profile
# format, no conversion needed.
sonar.go.coverage.reportPaths=coverage.out

# Populated by a second `go test -race ./... -json` run in the same job
# — test pass/fail/skip counts and duration, a separate signal from
# coverage.
sonar.go.tests.reportPaths=report.json

# conformance/**/*.py and conformance/**/*.go (the setup-config and
# generate-client-key tools) are local dev/CI tooling that drives the
# OIDF conformance suite (see conformance/README.md) — never imported by
# client, server, resource or internal/, and covered by actually running
# it against a live suite (conformance/scripts/run-all.sh), not by unit
# tests; none of these have a _test.go/pytest counterpart, deliberately.
# For the .py files this repo also has no Python coverage provider
# wired into CI at all (ci.yml only ever produces coverage.out for Go,
# via sonar.go.coverage.reportPaths above), so every Python line would
# otherwise always read as 0% covered regardless — the exact same
# "metric that structurally can't reflect reality" reasoning as this
# file's own **/*_test.go exclusion above.
#
# cmd/conformance-client is the same story under a different directory:
# the OIDF RP-conformance driver binary, likewise verified by an actual
# suite run, not unit tests.
#
# cmd/conformance-as/main.go specifically (not the rest of that
# package — config.go/token.go/resource.go/wiring.go etc. keep real
# unit coverage and stay gated): func main() itself calls flag.Parse(),
# log.Fatal (os.Exit) on every validation failure, and blocks forever
# on ListenAndServeTLS, none of which a unit test can drive — verified
# instead by TestSmokeMTLSFlow (cmd/conformance-as/mtls_smoke_test.go)
# standing up the exact same wiring over a real TLS listener, and by
# an actual suite run (conformance/server/oidf-config/README.md). Every
# piece of main()'s own decision logic that *can* be extracted into a
# testable function already has been (resolveMTLSEndpoints,
# newMTLSServer, buildMTLSEndpoints — all 100%/82%+ covered); what's
# left is the entrypoint glue itself.
#
# cmd/conformance-federation-trust-anchor is the same story as
# cmd/conformance-client above: a minimal standing OpenID Federation
# Trust Anchor for conformance-testing this repo's own AS against a
# live OIDF suite instance, verified by actually running it
# (conformance/server/scripts/README.md's own "OpenID Federation"
# section), not by unit tests.
sonar.coverage.exclusions=conformance/**/*.py,conformance/**/*.go,cmd/conformance-client/**/*.go,cmd/conformance-as/main.go,cmd/conformance-federation-trust-anchor/**/*.go

# internal/jose/header.go and internal/jwe/header.go's parseHeader
# functions are structurally identical for ~10 lines (decode, then
# check "crit" via internal/critical) purely because JWS and JWE
# headers both follow the same RFC 7515/7516 shape — not because
# either was copy-pasted carelessly. The two rawHeader types have
# different fields entirely (JWE's alone carries "enc"/"epk"), so
# there's nothing left to extract without an interface-based generic
# decoder whose indirection would cost more than the ~10 duplicated
# lines it would save. Excluded from copy-paste detection rather than
# forcing that abstraction.
#
# server/errors.go, resource/errors.go and federation/errors.go's own
# Error types are near-identical for the same reason: RFC 6749 §5.2,
# RFC 6750 §3.1 and OpenID Federation 1.0 §8.9 all define the same
# {"error", "error_description"} wire shape, so Code/PublicDescription
# /HTTPStatus/Unwrap/WriteJSON end up with near-identical one-line doc
# comments and signatures across all three. The actual logic these
# methods share (JSON encoding, header-writing, message formatting) is
# already extracted into internal/httperror — every method body here
# is a single delegating line. What's left is the declarations and doc
# comments themselves, which is exactly what has to stay duplicated:
# `go doc` (and pkg.go.dev) cannot resolve a method through a type
# alias or embedded field to a generic type in another package, so
# sharing these declarations via generics would make every one of
# these methods' own doc comments invisible to an integrator running
# `go doc github.com/idfoundry/fapigo/server Error` — a materially
# worse outcome than the duplication this excludes.

# client/signer.go and server/signer.go each define their own
# keyManagerSigner type adapting a keys.KeyManager to crypto.Signer, so
# each package's own signing key can be used with internal/jose without
# ever exposing a crypto.Signer (or private key) through the public
# keys package. The two are structurally identical (same fields, same
# two methods) for the same reason internal/jose/header.go and
# internal/jwe/header.go are below: crypto.Signer's method set is fixed
# by the standard library, and each adapter is deliberately unexported
# and package-local (never a shared public type another package could
# import instead), so there is nothing left to extract without an
# exported type that would undermine the entire reason this adapter
# exists in the first place.
sonar.cpd.exclusions=internal/jose/header.go,internal/jwe/header.go,server/errors.go,resource/errors.go,federation/errors.go,client/signer.go,server/signer.go

# conformance/**/*.py's own functions (e.g.
# conformance/server/scripts/unblock-implicit-callback.py's response
# handler, conformance/server/scripts/retry-flaky-modules.py's retry
# driver) are one-off local dev/CI scripts for wrangling the OIDF
# conformance suite (see conformance/README.md and the
# sonar.coverage.exclusions rationale above for why this whole tree is
# already treated as dev tooling, not customer-facing production code),
# not a maintained library surface — their cognitive complexity is
# accepted scripting-style debt, deferred indefinitely rather than
# refactored, so python:S3776 is suppressed for this tree specifically
# (not a blanket sonar.exclusions) to keep every other rule category —
# bugs, vulnerabilities, other code smells — still active for scripts
# that do drive a live server and client against a real suite.
#
# The same reasoning extends to the Go conformance tooling
# (cmd/conformance-as, cmd/conformance-client,
# cmd/conformance-federation-trust-anchor, and conformance/**'s own Go
# scripts such as setup-config) and conformance/**/*.sh: suite drivers
# and harness wiring, never imported by the library. Three
# maintainability-only rules are suppressed there — go:S1192
# (duplicated string literals: fixture key IDs, config file names,
# header names repeated across one-off setup code), go:S3776 (cognitive
# complexity of long, linear driver/setup functions) and go:S107
# (parameter count on wiring helpers) — plus shelldre:S1192 for
# run-all.sh's repeated leg names. Every other rule (bugs,
# vulnerabilities, security hotspots, other code smells) stays active
# on this code, and library packages keep all four rules.
sonar.issue.ignore.multicriteria=conformancePyComplexity,confCmdLiterals,confCmdComplexity,confCmdParams,confScriptLiterals,confScriptComplexity,confScriptParams,confShellLiterals
sonar.issue.ignore.multicriteria.conformancePyComplexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.conformancePyComplexity.resourceKey=conformance/**/*.py
sonar.issue.ignore.multicriteria.confCmdLiterals.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.confCmdLiterals.resourceKey=cmd/conformance-*/**/*.go
sonar.issue.ignore.multicriteria.confCmdComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.confCmdComplexity.resourceKey=cmd/conformance-*/**/*.go
sonar.issue.ignore.multicriteria.confCmdParams.ruleKey=go:S107
sonar.issue.ignore.multicriteria.confCmdParams.resourceKey=cmd/conformance-*/**/*.go
sonar.issue.ignore.multicriteria.confScriptLiterals.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.confScriptLiterals.resourceKey=conformance/**/*.go
sonar.issue.ignore.multicriteria.confScriptComplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.confScriptComplexity.resourceKey=conformance/**/*.go
sonar.issue.ignore.multicriteria.confScriptParams.ruleKey=go:S107
sonar.issue.ignore.multicriteria.confScriptParams.resourceKey=conformance/**/*.go
sonar.issue.ignore.multicriteria.confShellLiterals.ruleKey=shelldre:S1192
sonar.issue.ignore.multicriteria.confShellLiterals.resourceKey=conformance/**/*.sh
