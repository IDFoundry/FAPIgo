name: Fuzz

# Runs this repo's Go native fuzz targets (FuzzXxx functions, alongside
# their package's own _test.go files) with actual mutation-based fuzzing
# (`go test -fuzz=...`), not just their seed corpus — a plain `go test`
# run (ci.yml's own test step) only ever exercises the seed corpus and
# any already-committed regression entries under testdata/fuzz/, so this
# is what actually looks for new crashing/misbehaving inputs. Deliberately
# not triggered on push/pull_request: each target needs real wall-clock
# time to be worth anything, which would slow down every PR's feedback
# loop for a check that isn't about that diff specifically. Scheduled
# instead, daily (staggered an hour after conformance.yml's own 6am UTC
# run to avoid contending for runner minutes), plus available on demand.
#
# Informational only: nothing in branch protection depends on this
# workflow, since it never runs against a PR. A found failure fails the
# job and uploads the failing input as a build artifact (go test -fuzz
# writes it under testdata/fuzz/<FuzzName>/ itself, the same format
# already used for this repo's own committed regression corpus — see
# internal/canonical/testdata/fuzz/FuzzURI/ for an example a first run of
# this suite already found) for a human to pull down, inspect, and — once
# satisfied it's a real bug fixed or worth tracking — commit into the
# repo as a permanent regression corpus entry; this workflow never
# commits back on its own.

on:
  schedule:
    - cron: '0 7 * * *' # daily, 7am UTC — an hour after conformance.yml's own 6am run
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - pkg: ./internal/jose
            name: FuzzParseCompact
          - pkg: ./internal/jose
            name: FuzzParseJWK
          - pkg: ./internal/jose
            name: FuzzParseJWKSet
          - pkg: ./internal/jose
            name: FuzzSignVerifyTamper
          - pkg: ./internal/canonical
            name: FuzzURI
          - pkg: ./internal/federation
            name: FuzzParseEntityStatement
          - pkg: ./internal/federation
            name: FuzzParseTrustMark
          - pkg: ./internal/federation
            name: FuzzParseTrustMarkDelegation
          - pkg: ./internal/federation
            name: FuzzParseResolveResponse
          - pkg: ./internal/federation
            name: FuzzParseHistoricalKeysResponse
          - pkg: ./internal/federation
            name: FuzzParseTrustMarkStatusResponse
          - pkg: ./internal/jwe
            name: FuzzDecrypt
          - pkg: ./internal/jwe
            name: FuzzEncryptDecryptTamper
          - pkg: ./internal/requestobject
            name: FuzzParseRequestObject
          - pkg: ./internal/dpop
            name: FuzzVerifyDPoPProof
          - pkg: ./internal/dpop
            name: FuzzVerifyDPoPProofClaimMismatch
          - pkg: ./internal/clientassertion
            name: FuzzParseClientAssertion
          - pkg: ./internal/clientattestation
            name: FuzzParseClientAttestation
          - pkg: ./internal/clientattestation
            name: FuzzParsePoP
          - pkg: ./internal/par
            name: FuzzDecodeForm
          - pkg: ./internal/par
            name: FuzzFormRoundTrip
          - pkg: ./internal/metadata
            name: FuzzParseAndValidate
          - pkg: ./internal/jarm
            name: FuzzParseJARMResponse
          - pkg: ./internal/token
            name: FuzzParseAccessToken
          - pkg: ./internal/token
            name: FuzzParseIDToken
          - pkg: ./extension
            name: FuzzRARRegistryParse
          - pkg: ./internal/par
            name: FuzzDecodeResult
          - pkg: ./internal/par
            name: FuzzDecodeErrorResponse
          - pkg: ./internal/par
            name: FuzzResultRoundTrip
          - pkg: ./internal/par
            name: FuzzErrorResponseRoundTrip
          - pkg: ./resource
            name: FuzzVerifyResourceRequest
          - pkg: ./server
            name: FuzzFormRequestFromHTTP
          - pkg: ./server
            name: FuzzFormRequestFromHTTPQueryUnescape
          - pkg: ./client
            name: FuzzDecodeTokenResponse
          - pkg: ./client
            name: FuzzDecodeBackchannelAuthenticationResponse
          - pkg: .
            name: FuzzParseEndpointURL
          - pkg: ./server
            name: FuzzParseRequestedClaimNames
          - pkg: ./server
            name: FuzzDecodeRecords
          - pkg: ./server
            name: FuzzGrantRecordRoundTrip
          - pkg: ./server
            name: FuzzGrantedIDTokenClaims
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # No go.sum exists — this module has zero external
          # dependencies (see go.mod) — see ci.yml's identical setting
          # for why this is needed instead.
          cache-dependency-path: go.mod

      - name: go test -fuzz=${{ matrix.target.name }}
        run: go test ${{ matrix.target.pkg }} -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=5m

      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure-${{ matrix.target.name }}
          path: '**/testdata/fuzz/${{ matrix.target.name }}/'
          retention-days: 30
