# Runs conformance-as against the OpenID Foundation conformance suite
# entirely locally — no tunnel required. See scripts/README.md for the
# full procedure.
#
# Why no CA/tunnel is needed: the suite's own outbound HTTP client
# (net.openid.conformance.condition.AbstractCondition.createHttpClient)
# trusts any certificate and skips hostname verification for every call
# it makes to the implementation under test. So the only real
# requirement is that the suite's containers can reach this one, which
# this file gets by attaching to the suite's own docker-compose network
# rather than by making the cert trusted.
#
# Usage:
#   1. Start the OIDF conformance suite separately (its own
#      docker-compose up) and find the network it created:
#        docker network ls   # usually <suite-checkout-dir>_default
#   2. export SUITE_NETWORK=<that network name>   (defaults below)
#   3. ./scripts/generate-server-cert.sh
#   4. Fill in oidf-config/*.config.json — see oidf-config/README.md
#   5. docker compose up --build conformance-as-baseline
#      (or conformance-as-message-signing, or both)
#
# ACCESS_TOKEN_FORMAT=jwt|opaque (defaults to jwt) selects which
# cmd/conformance-as -access-token-format both containers start with —
# for a manual one-off run against either; conformance/scripts/run-all.sh
# itself only ever runs the AS legs under the default, jwt (see that
# script's own comment for why the format is no longer looped).
#
# The suite sometimes shows a "visit https://conformance-as-baseline:8443/
# authorize?..." link for you to open in your own browser — that
# hostname is Docker-internal and won't resolve on your host. Don't
# fight this with host networking (the suite's own nginx already
# publishes 0.0.0.0:8443/8444, so no other container can bind that port
# on any host interface either — a wildcard bind blocks all others).
# Configure the plan's `browser` automation block instead (see
# scripts/README.md) so the suite's own in-container browser — which
# already sits on this same Docker network — drives consent itself. For
# a one-off manual click-through, substitute this file's published host
# port for the hostname in the link instead.

services:
  conformance-as-baseline:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-baseline
    networks: [suite]
    ports:
      - "18443:8443" # optional: only needed to poke it from the host.
      # Not 8443 -> the suite's own nginx already occupies that port on
      # every host interface. This container's actual reachability from
      # the suite is via the docker network + hostname, independent of
      # this host-side publish — see this file's header comment.
    volumes:
      - ./oidf-config/baseline.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -client-credentials-grant

  conformance-as-message-signing:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-message-signing
    networks: [suite]
    ports:
      - "18444:8443" # see conformance-as-baseline's port comment above
    volumes:
      - ./oidf-config/message-signing.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}

  conformance-as-ciba:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-ciba
    networks: [suite]
    ports:
      - "18445:8443" # see conformance-as-baseline's port comment above
    volumes:
      - ./oidf-config/ciba.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -ciba

  conformance-as-ciba-mtls:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-ciba-mtls
    networks: [suite]
    ports:
      - "18446:8443" # see conformance-as-baseline's port comment above
      - "18447:8444" # the -mtls listener (mtls_listen_addr in the config)
    volumes:
      - ./oidf-config/ciba-mtls.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -ciba
      - -mtls

  conformance-as-client-auth-mtls:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-client-auth-mtls
    networks: [suite]
    ports:
      - "18448:8443" # see conformance-as-baseline's port comment above
      - "18449:8444" # the -mtls listener (mtls_listen_addr in the config)
    volumes:
      - ./oidf-config/client-auth-mtls.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -mtls
      - -client-credentials-grant

  # sender_constrain=mtls (RFC 8705 §3) under the ordinary
  # PAR/authorize/token flow — orthogonal to both conformance-as-ciba-mtls
  # (mTLS-bound tokens, but CIBA has no PAR/authorize hop at all) and
  # conformance-as-client-auth-mtls (full PAR/authorize/token flow under
  # mTLS, but only for RFC 8705 §2 client *authentication* — sender
  # -constraining stays DPoP there).
  conformance-as-mtls:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-mtls
    networks: [suite]
    ports:
      - "18450:8443" # see conformance-as-baseline's port comment above
      - "18451:8444" # the -mtls listener (mtls_listen_addr in the config)
    volumes:
      - ./oidf-config/mtls.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -mtls
      - -client-credentials-grant

  # conformance-as-mtls's own message-signing counterpart — confirms
  # mTLS sender-constraining composes correctly with signed request
  # objects/JARM too.
  conformance-as-message-signing-mtls:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-message-signing-mtls
    networks: [suite]
    ports:
      - "18452:8443" # see conformance-as-baseline's port comment above
      - "18453:8444" # the -mtls listener (mtls_listen_addr in the config)
    volumes:
      - ./oidf-config/message-signing-mtls.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -mtls

  # FAPI2SP "MTLS + MTLS": RFC 8705 §2 client authentication *and* §3
  # sender-constraining together on the same client — the one FAPI2SP
  # combination neither conformance-as-client-auth-mtls (§2 only,
  # sender_constrain stays dpop) nor conformance-as-mtls (§3 only,
  # client_auth_type stays private_key_jwt) covers alone.
  conformance-as-client-auth-mtls-and-mtls:
    build:
      context: ../..
      dockerfile: conformance/server/Dockerfile
    hostname: conformance-as-client-auth-mtls-and-mtls
    networks: [suite]
    ports:
      - "18454:8443" # see conformance-as-baseline's port comment above
      - "18455:8444" # the -mtls listener (mtls_listen_addr in the config)
    volumes:
      - ./oidf-config/client-auth-mtls-and-mtls.config.json:/config.json:ro
      - ./certs:/certs:ro
    command:
      - -config=/config.json
      - -cert=/certs/server.crt
      - -key=/certs/server.key
      - -access-token-format=${ACCESS_TOKEN_FORMAT:-jwt}
      - -mtls
      - -client-credentials-grant

networks:
  suite:
    external: true
    name: ${SUITE_NETWORK:-conformance-suite_default}
