version: 2
updates:
  # This module has zero third-party Go dependencies today (see
  # go.mod) — nothing for this ecosystem to actually find right now.
  # Kept enabled anyway so a dependency added later is never silently
  # unwatched from day one.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # sqlstore/ is a module of its own: the database drivers its tests
  # use, and the FAPIgo release it requires. examples/linked-accounts
  # builds against it (a replace) and takes its SQLite driver too, so
  # its go.mod must require at least what sqlstore's does: each
  # dependency is updated in both directories in one pull request.
  - package-ecosystem: gomod
    directories:
      - /sqlstore
      - /examples/linked-accounts
    schedule:
      interval: weekly
    groups:
      sqlstore:
        group-by: dependency-name

  # Keeps every action the workflows use current — the one real
  # dependency surface this repo has. Each is pinned to a full commit
  # SHA with its version as a trailing comment (`@<sha> # vX.Y.Z`),
  # GitHub's own actions included, so a moved tag can't change what
  # runs; Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The conformance images' base images, pinned by digest
  # (`image:tag@sha256:...`) so a moved tag can't change what's built;
  # Dependabot updates the digest when the tag moves.
  - package-ecosystem: docker
    directories:
      - /conformance/server
      - /cmd/conformance-federation-trust-anchor
    schedule:
      interval: weekly

  # The PostgreSQL image ci.yml's sqlstore job runs as a service
  # container. Dependabot can't update a workflow's service image, so
  # .github/postgres/Dockerfile carries the same pin for it to move, and
  # ci.yml's lint job fails until the new digest is copied to ci.yml.
  # Only the digest and minor tags move here: which PostgreSQL major the
  # stores are tested against is a decision, not a routine update.
  - package-ecosystem: docker
    directory: /.github/postgres
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # The conformance suite scripts' Python packages
  # (conformance/requirements-suite.in, compiled with hashes to
  # requirements-suite.txt). Test tooling only: nothing here ships.
  - package-ecosystem: pip
    directory: /conformance
    schedule:
      interval: weekly
