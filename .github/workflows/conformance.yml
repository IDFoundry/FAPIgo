name: FAPI2 Conformance

# Runs all eight FAPI2 conformance suites this repo has driver support
# for — including the CIBA/mTLS pair (AS ciba-mtls, RP ciba-mtls) and
# the client-auth-mtls pair (AS/RP), each of which needs its own extra
# conformance-as container and/or mTLS driver flag — see
# conformance/scripts/run-all.sh, against a freshly-brought-up OIDF
# conformance suite. Deliberately not triggered
# on push/pull_request — this is a heavy job (bringing up the suite's
# own Docker stack, ~6-7 minutes of test execution locally, likely more
# on a shared runner) that would otherwise slow down every PR's
# feedback loop. Scheduled instead, daily, plus available on demand.
#
# Informational only: nothing in branch protection depends on this
# workflow, since it never runs against a PR in the first place. The
# job's own exit code still reflects run-all.sh's real pass/fail, so the
# Actions tab shows an accurate result — it just isn't wired into
# anything that blocks a merge.
#
# Tracks the OIDF suite's latest master/prebuilt images on every run (no
# version pin) — simplest, and consistent with how the suite is used
# locally today.

on:
  schedule:
    - cron: '0 6 * * *' # daily, 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # No go.sum exists — this module has zero external
          # dependencies (see go.mod) — see ci.yml's identical setting
          # for why this is needed instead.
          cache-dependency-path: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Cloned into a directory literally named conformance-suite so
      # Docker Compose's auto-derived project (and therefore network)
      # name — conformance-suite_default — matches
      # conformance/server/docker-compose.yml's own existing default for
      # SUITE_NETWORK, without needing to set it explicitly.
      - name: Clone OIDF conformance suite
        run: git clone --depth 1 https://gitlab.com/openid/conformance-suite.git /tmp/conformance-suite

      # --only-binary :all: refuses to build from a source distribution
      # (sdist), which can run arbitrary code (setup.py/build-backend)
      # during install — this is a third-party repo's own
      # requirements.txt (currently just httpx and pyparsing, both pure
      # Python with universal wheels on PyPI), not ours to audit line
      # by line. Verified this doesn't break anything: both deps
      # install fine wheel-only.
      - name: Install suite script dependencies
        run: "pip install --only-binary :all: -r /tmp/conformance-suite/scripts/requirements.txt"

      # Prebuilt images — no Java/Maven build needed, mirrors this
      # repo's own conformance/server/scripts/README.md "Manual test
      # run" step 1.
      - name: Bring up OIDF conformance suite
        working-directory: /tmp/conformance-suite
        run: docker compose -f docker-compose-prebuilt.yml up -d

      # Generates the gitignored plan configs (private test-client keys)
      # plus registers matching public keys with this AS — exactly the
      # "fresh, unconfigured checkout" scenario this tool exists for.
      - name: Generate throwaway conformance-as config and keys
        run: go run ./conformance/server/scripts/setup-config

      - name: Generate throwaway TLS cert
        run: ./conformance/server/scripts/generate-server-cert.sh

      # run-all.sh itself waits for the suite to become reachable, waits
      # for the AS containers to come up, runs all eight suites, retries
      # the one known suite-internal flake automatically, and writes
      # report.md — nothing CI-specific needed here beyond pointing it
      # at the suite checkout and a predictable results directory.
      - name: Run all eight conformance suites
        env:
          CONFORMANCE_SUITE_CHECKOUT: /tmp/conformance-suite
          WORKDIR: ${{ runner.temp }}/conformance-results
        run: ./conformance/scripts/run-all.sh

      - name: Add report to job summary
        if: always()
        run: cat "${{ runner.temp }}/conformance-results/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results
          retention-days: 14

      - name: Tear down suite containers
        if: always()
        run: |
          (cd /tmp/conformance-suite && docker compose -f docker-compose-prebuilt.yml down -v) || true
          (cd conformance/server && docker compose down) || true
