# Maintains an up-to-date "release PR" (version bump + CHANGELOG.md,
# computed from Conventional Commits messages on main since the last
# release — see CONTRIBUTING.md) on every push to main, and tags +
# publishes a GitHub Release the moment that PR is merged. See
# release-please-config.json / .release-please-manifest.json for the
# actual version/tag configuration.
#
# Uses a personal-access-token secret (RELEASE_PLEASE_TOKEN), not the
# default GITHUB_TOKEN — required so the release PR this action opens
# actually triggers ci.yml on itself; GitHub blocks GITHUB_TOKEN-
# authored events from triggering other workflows, to prevent
# recursion. See CONTRIBUTING.md for what the token needs.
name: release-please

on:
  push:
    branches: [main]

# Read-only by default; the one job grants itself only what it needs
# (OpenSSF Scorecard's Token-Permissions check). The action itself
# authenticates with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

# One run at a time: two pushes in quick succession would otherwise race
# to update the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # GitHub's API occasionally fails a request outright (a 5xx, or a
      # GraphQL error with no message), which fails the action with
      # "release-please failed: Server Error" or an empty message and
      # leaves the release PR stale until the next push. release-please
      # recomputes everything from the history each run, so one retry
      # after a pause is safe; a second failure fails the job.
      - id: attempt
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.attempt.outcome == 'failure'
        run: sleep 30
      - if: steps.attempt.outcome == 'failure'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
