name: huskarl interop

# A second, independent client in a second language: huskarl (Rust),
# through the same kinds of flows against cmd/conformance-as, on the
# configuration interop/openid-client/setup.mjs writes (so Node.js is
# needed for that script only). The toolchain is pinned here; huskarl
# and every other crate by interop/huskarl's Cargo.toml and Cargo.lock,
# built with `cargo build --locked`. See interop/README.md.
#
# Weekly (Sunday 10am UTC), on demand, and on a pull request that
# changes the suite, the setup script it shares, or the server it
# drives.
#
# Informational only: not a required check in branch protection.

on:
  schedule:
    - cron: '0 10 * * 0' # weekly, Sunday 10am UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - interop/huskarl/**
      - interop/run-huskarl.sh
      - interop/openid-client/setup.mjs
      - .github/workflows/interop-huskarl.yml
      # cmd/conformance-as and the packages it builds from.
      - '*.go'
      - go.mod
      - client/**
      - cmd/conformance-as/**
      - extension/**
      - fapihttp/**
      - fapitest/**
      - federation/**
      - internal/**
      - keys/**
      - pairwise/**
      - resource/**
      - server/**
      - serverresource/**
      - storage/**

permissions:
  contents: read

jobs:
  huskarl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # See ci.yml: no go.sum at the root.
          cache-dependency-path: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true

      # dtolnay/rust-toolchain publishes no release tags, only the moving
      # v1 tag: pinned by SHA, with the Rust version pinned explicitly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: interop/huskarl

      - name: Run the huskarl legs
        run: ./interop/run-huskarl.sh
