sonar.organization=idfoundry
sonar.projectKey=IDFoundry_FAPIgo

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Without this, Sonar's Go sensor scans _test.go files as ordinary
# source needing coverage — since go test's own coverage.out never
# contains an entry for a test file itself (only the code it
# exercises), every test file then scores a guaranteed 0%, inflating
# the coverage denominator by roughly the size of this repo's own test
# suite (close to 1:1 with non-test code — see GETTING_STARTED.md/scc).
# Confirmed via the SonarCloud API before this fix: individual _test.go
# files (e.g. resource/verify_test.go) reported non-zero
# lines_to_cover, 0.0% coverage.
sonar.exclusions=**/*_test.go

# Populated by ci.yml's `test` job (go test -race -coverprofile=coverage.out
# ./...) before the SonarQube scan step runs — the native Go cover-profile
# format, no conversion needed.
sonar.go.coverage.reportPaths=coverage.out

# Populated by a second `go test -race ./... -json` run in the same job
# — test pass/fail/skip counts and duration, a separate signal from
# coverage.
sonar.go.tests.reportPaths=report.json

# conformance/**/*.py and conformance/**/*.go (the setup-config and
# generate-client-key tools) are local dev/CI tooling that drives the
# OIDF conformance suite (see conformance/README.md) — never imported by
# client, server, resource or internal/, and covered by actually running
# it against a live suite (conformance/scripts/run-all.sh), not by unit
# tests; none of these have a _test.go/pytest counterpart, deliberately.
# For the .py files this repo also has no Python coverage provider
# wired into CI at all (ci.yml only ever produces coverage.out for Go,
# via sonar.go.coverage.reportPaths above), so every Python line would
# otherwise always read as 0% covered regardless — the exact same
# "metric that structurally can't reflect reality" reasoning as this
# file's own **/*_test.go exclusion above.
#
# cmd/conformance-client is the same story under a different directory:
# the OIDF RP-conformance driver binary, likewise verified by an actual
# suite run, not unit tests.
sonar.coverage.exclusions=conformance/**/*.py,conformance/**/*.go,cmd/conformance-client/**/*.go
