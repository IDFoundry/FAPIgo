[package]
name = "fapigo-interop-huskarl"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
description = "Interoperability harness: huskarl (Rust) runs FAPI 2.0 flows against cmd/conformance-as"
license = "MIT"
publish = false

# Every direct dependency is pinned to an exact version, and Cargo.lock pins
# the whole tree; the runner builds with `cargo build --locked`.
[dependencies]
bytes = "=1.12.1"
http = "=1.5.0"
huskarl = "=0.11.10"
huskarl-crypto-native = "=0.11.3"
huskarl-reqwest = { version = "=0.9.3", features = ["rustls-tls"] }
# TLS trust (the run's test CA) and the consent-form requests.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
