name: FAPI Conformance

# Runs all twenty-four FAPI2/FAPI-CIBA/OpenID-Federation test
# configurations this repo has driver support for — one underlying OIDF
# conformance suite, exercised under twenty-four different plan/variant
# combinations: including AS pairwise (the baseline plan with pairwise
# subject identifiers), the CIBA/mTLS pair (AS ciba-mtls, RP
# ciba-mtls), AS ciba-ping, the client-auth-mtls pair (AS/RP), the
# client-auth-mtls-and-mtls pair (AS/RP), the two ciba-*-client-auth-mtls
# legs, the four *-client-credentials legs, each of which needs its own
# extra conformance-as container and/or mTLS driver flag, and the one
# OpenID Federation leg (Federation federation-deployed-entity, its own
# pair of federation-aware containers) — see conformance/scripts/run-all.sh,
# against a freshly-brought-up OIDF conformance suite. Deliberately not triggered
# on push/pull_request — this is a heavy job (bringing up the suite's
# own Docker stack, ~6-7 minutes of test execution locally) that would
# otherwise slow down every PR's feedback loop. Scheduled instead,
# daily, plus available on demand. A shared runner is markedly slower
# than that local baseline — a real run exceeded the previous 30-minute
# timeout and was cancelled, which is why this was raised to 60 and
# then, once the leg count grew from eleven to twenty, to 120 below.
#
# Informational only: nothing in branch protection depends on this
# workflow, since it never runs against a PR in the first place. The
# job's own exit code still reflects run-all.sh's real pass/fail, so the
# Actions tab shows an accurate result — it just isn't wired into
# anything that blocks a merge.
#
# Tracks the OIDF suite's latest master/prebuilt images on every run (no
# version pin) — simplest, and consistent with how the suite is used
# locally today. Each run records the suite commit and image digests it
# tested in its job summary ("Record OIDF suite version" below), so a
# new failure can be checked against the last green run's suite.

on:
  schedule:
    - cron: '0 6 * * *' # daily, 6am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # No go.sum exists — this module has zero external
          # dependencies (see go.mod) — see ci.yml's identical setting
          # for why this is needed instead.
          cache-dependency-path: go.mod

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # Cloned into a directory literally named conformance-suite so
      # Docker Compose's auto-derived project (and therefore network)
      # name — conformance-suite_default — matches
      # conformance/server/docker-compose.yml's own existing default for
      # SUITE_NETWORK, without needing to set it explicitly.
      - name: Clone OIDF conformance suite
        run: git clone --depth 1 https://gitlab.com/openid/conformance-suite.git /tmp/conformance-suite

      # The suite's scripts need what its own scripts/requirements.txt
      # lists (httpx and pyparsing). That list is unpinned, so this
      # installs conformance/requirements-suite.txt instead: the same
      # packages compiled with exact versions and hashes
      # (--require-hashes), refreshed as conformance/requirements-suite.in
      # describes. --only-binary :all: also refuses a source
      # distribution, which could run arbitrary code while installing;
      # every package here has a universal wheel.
      - name: Install suite script dependencies
        run: "pip install --require-hashes --only-binary :all: -r conformance/requirements-suite.txt"

      # Prebuilt images — no Java/Maven build needed, mirrors this
      # repo's own conformance/server/scripts/README.md "Manual test
      # run" step 1. The override maps host.docker.internal for the
      # suite's server container, which Linux Docker doesn't define on
      # its own — see the override file's comment.
      - name: Bring up OIDF conformance suite
        working-directory: /tmp/conformance-suite
        run: docker compose -f docker-compose-prebuilt.yml -f "$GITHUB_WORKSPACE/conformance/scripts/suite-host-gateway.override.yml" up -d

      # Records exactly which suite this run tested: the cloned commit
      # and the digest of each prebuilt image, which are built from
      # master separately and can lag the commit. Since every run tracks
      # the suite's latest (see the top of this file), comparing this
      # with the last green run's shows straight away whether a new
      # failure came with a suite change. Written to the job summary and
      # to the uploaded results; runs even if bringing the suite up
      # failed, so an image that couldn't be pulled shows as such. Each
      # docker call is time-limited, so a stalled daemon can't hold the
      # job until its timeout.
      - name: Record OIDF suite version
        if: always()
        working-directory: /tmp/conformance-suite
        env:
          RESULTS: ${{ runner.temp }}/conformance-results
        run: |
          mkdir -p "$RESULTS"
          {
            echo "### OIDF conformance suite under test"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\` ($(git log -1 --format='%cI %s'))"
            images=$(timeout 30 docker compose -f docker-compose-prebuilt.yml config --images || true)
            [ -n "$images" ] || echo "- Images: couldn't be listed"
            for image in $images; do
              digest=$(timeout 30 docker image inspect --format '{{index .RepoDigests 0}}' "$image" 2>/dev/null || echo "not pulled")
              echo "- Image \`$image\`: \`$digest\`"
            done
            echo
          } | tee "$RESULTS/suite-version.md" >> "$GITHUB_STEP_SUMMARY"

      # Generates the gitignored plan configs (private test-client keys)
      # plus registers matching public keys with this AS — exactly the
      # "fresh, unconfigured checkout" scenario this tool exists for.
      - name: Generate throwaway conformance-as config and keys
        run: go run ./conformance/server/scripts/setup-config

      - name: Generate throwaway TLS cert
        run: ./conformance/server/scripts/generate-server-cert.sh

      # run-all.sh itself waits for the suite to become reachable, waits
      # for the AS containers to come up, runs all twenty-four test
      # configurations (including bringing up its own federation
      # containers and syncing their ephemeral keys — no separate step
      # needed here for that), retries the one known suite-internal
      # flake automatically, and writes report.md — nothing CI-specific
      # needed here beyond pointing it at the suite checkout and a
      # predictable results directory.
      - name: Run all twenty-four conformance test configurations
        env:
          CONFORMANCE_SUITE_CHECKOUT: /tmp/conformance-suite
          WORKDIR: ${{ runner.temp }}/conformance-results
        run: ./conformance/scripts/run-all.sh

      - name: Add report to job summary
        if: always()
        run: cat "${{ runner.temp }}/conformance-results/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-results
          retention-days: 14

      - name: Tear down suite containers
        if: always()
        run: |
          (cd /tmp/conformance-suite && docker compose -f docker-compose-prebuilt.yml down -v) || true
          (cd conformance/server && docker compose down) || true
