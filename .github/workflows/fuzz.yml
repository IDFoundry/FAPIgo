name: Fuzz

# Runs this repo's Go native fuzz targets (FuzzXxx functions, alongside
# their package's own _test.go files) with actual mutation-based fuzzing
# (`go test -fuzz=...`), not just their seed corpus — a plain `go test`
# run (ci.yml's own test step) only ever exercises the seed corpus and
# any already-committed regression entries under testdata/fuzz/, so this
# is what actually looks for new crashing/misbehaving inputs. Deliberately
# not triggered on push/pull_request: each target needs real wall-clock
# time to be worth anything, which would slow down every PR's feedback
# loop for a check that isn't about that diff specifically. Scheduled
# instead, daily (staggered an hour after conformance.yml's own 6am UTC
# run to avoid contending for runner minutes), plus available on demand.
#
# The corpus each target builds up (the "interesting" inputs go test
# -fuzz keeps under $(go env GOCACHE)/fuzz) is carried from run to run
# with actions/cache, so every night resumes from the last one's
# coverage instead of re-deriving it from the seed corpus. setup-go's
# own cache can't do this: its key is fixed per Go version and go.mod,
# so it only ever saves once. Each run saves under a run-unique key and
# restores the newest for its target; GitHub evicts ones left unused.
# The corpus is saved even when the job fails: a crashing input is
# written to testdata/ (and uploaded as an artifact, below), never into
# the corpus, and go test -fuzz occasionally reports "context deadline
# exceeded" right at -fuzztime with no failing input at all — saving
# regardless keeps that harness quirk from discarding a night's
# progress.
#
# That quirk alone doesn't fail the job either:
# .github/scripts/fuzz-target.sh reports it as a warning when go test
# failed, said "context deadline exceeded", panicked nowhere and wrote no
# new input under testdata/fuzz/. Every other failure still fails, and a
# real finding always writes its input there, so it can't pass as the
# quirk. Before this, the quirk turned roughly one nightly run in four
# red, which made a real red run easy to dismiss.
#
# Informational only: nothing in branch protection depends on this
# workflow, since it never runs against a PR. A found failure fails the
# job and uploads the failing input as a build artifact (go test -fuzz
# writes it under testdata/fuzz/<FuzzName>/ itself, the same format
# already used for this repo's own committed regression corpus — see
# internal/canonical/testdata/fuzz/FuzzURI/ for an example a first run of
# this suite already found) for a human to pull down, inspect, and — once
# satisfied it's a real bug fixed or worth tracking — commit into the
# repo as a permanent regression corpus entry; this workflow never
# commits back on its own.
#
# So that a red run gets noticed, the alert job (at the end, via
# .github/scripts/fuzz-alert.sh) opens an issue labelled "fuzz" when a
# default-branch run fails, listing the failing targets and how to
# replay each one's artifact, or comments on the open one; the next
# passing run closes it. The failing input goes into the fix's commit as
# a seed under <pkg>/testdata/fuzz/<FuzzName>/, so plain go test replays
# it from then on.

on:
  schedule:
    - cron: '0 7 * * *' # daily, 7am UTC — an hour after conformance.yml's own 6am run
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - pkg: ./internal/jose
            name: FuzzParseCompact
          - pkg: ./internal/jose
            name: FuzzParseJWK
          - pkg: ./internal/jose
            name: FuzzParseJWKSet
          - pkg: ./internal/jose
            name: FuzzSignVerifyTamper
          - pkg: ./internal/canonical
            name: FuzzURI
          - pkg: ./internal/federation
            name: FuzzParseEntityStatement
          - pkg: ./internal/federation
            name: FuzzParseTrustMark
          - pkg: ./internal/federation
            name: FuzzMetadataPolicy
          - pkg: ./federation
            name: FuzzRegisteredClientConfigFromMetadata
          - pkg: ./federation
            name: FuzzDomainNameConstraintMatches
          - pkg: ./federation
            name: FuzzApplySuperiorMetadata
          - pkg: ./federation
            name: FuzzValidEntityID
          - pkg: ./internal/federation
            name: FuzzParseTrustMarkDelegation
          - pkg: ./internal/federation
            name: FuzzParseResolveResponse
          - pkg: ./internal/federation
            name: FuzzParseHistoricalKeysResponse
          - pkg: ./internal/federation
            name: FuzzParseTrustMarkStatusResponse
          - pkg: ./internal/jwe
            name: FuzzDecrypt
          - pkg: ./internal/jwe
            name: FuzzEncryptDecryptTamper
          - pkg: ./internal/requestobject
            name: FuzzParseRequestObject
          - pkg: ./internal/dpop
            name: FuzzVerifyDPoPProof
          - pkg: ./internal/dpop
            name: FuzzVerifyDPoPProofClaimMismatch
          - pkg: ./internal/clientassertion
            name: FuzzParseClientAssertion
          - pkg: ./internal/clientattestation
            name: FuzzParseClientAttestation
          - pkg: ./internal/clientattestation
            name: FuzzParsePoP
          - pkg: ./internal/par
            name: FuzzDecodeForm
          - pkg: ./internal/par
            name: FuzzFormRoundTrip
          - pkg: ./internal/metadata
            name: FuzzParseAndValidate
          - pkg: ./internal/jarm
            name: FuzzParseJARMResponse
          - pkg: ./internal/token
            name: FuzzParseAccessToken
          - pkg: ./internal/token
            name: FuzzParseIDToken
          - pkg: ./extension
            name: FuzzRARRegistryParse
          - pkg: ./extension
            name: FuzzParseGrantedRAR
          - pkg: ./internal/par
            name: FuzzDecodeResult
          - pkg: ./internal/par
            name: FuzzDecodeErrorResponse
          - pkg: ./internal/par
            name: FuzzResultRoundTrip
          - pkg: ./internal/par
            name: FuzzErrorResponseRoundTrip
          - pkg: ./resource
            name: FuzzVerifyResourceRequest
          - pkg: ./server
            name: FuzzFormRequestFromHTTP
          - pkg: ./server
            name: FuzzFormRequestFromHTTPQueryUnescape
          - pkg: ./client
            name: FuzzDecodeTokenResponse
          - pkg: ./client
            name: FuzzDecodeBackchannelAuthenticationResponse
          - pkg: .
            name: FuzzParseEndpointURL
          - pkg: .
            name: FuzzParseRedirectURL
          - pkg: ./server
            name: FuzzParseRequestedClaimNames
          - pkg: ./server
            name: FuzzDecodeRecords
          - pkg: ./server
            name: FuzzGrantRecordRoundTrip
          - pkg: ./server
            name: FuzzGrantedIDTokenClaims
          - pkg: ./internal/authchallenge
            name: FuzzParse
          - pkg: ./server
            name: FuzzClaimsReadersAgree
          - pkg: ./server
            name: FuzzInteractionRequestRoundTrip
          - pkg: ./server
            name: FuzzRequestedPromptAndMaxAge
          - pkg: ./internal/canonical
            name: FuzzURIEquivalence
          - pkg: ./internal/numericdate
            name: FuzzNumericDateParse
          - pkg: ./internal/numericdate
            name: FuzzNumericDateOrderPreserving
          - pkg: ./internal/strictb64
            name: FuzzStrictMatchesCanonical
          - pkg: ./internal/strictjson
            name: FuzzUnmarshalMatchesCaseSensitiveReading
          - pkg: ./internal/strictjson
            name: FuzzCheckFieldCaseThenDecode
          - pkg: ./extension
            name: FuzzExtensionValueReadersAgree
          - pkg: ./internal/sealedcookie
            name: FuzzJarOpen
          - pkg: ./server/interactioncookie
            name: FuzzRead
          - pkg: ./client
            name: FuzzOpenBackchannelSession
          - pkg: ./client
            name: FuzzOpenTokenSet
          - pkg: ./federation
            name: FuzzEntityIDHostAgreement
          - pkg: .
            name: FuzzParseSubjectType
          - pkg: ./pairwise
            name: FuzzNewPrefix
          - pkg: ./pairwise
            name: FuzzHMACDeterministicAndInjective
          - pkg: ./pairwise
            name: FuzzReversibleRoundTrip
          - pkg: ./pairwise
            name: FuzzReversibleTamper
          - pkg: ./pairwise
            name: FuzzReversibleLookupArbitrary
          - pkg: ./pairwise
            name: FuzzReversibleWithRoundTrip
          - pkg: ./storage
            name: FuzzDerivedSector
          - pkg: ./client
            name: FuzzResourceIndicatorAgreement
          - pkg: ./server
            name: FuzzResourcesFromParameters
          - pkg: ./server
            name: FuzzSplitResourceParameters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          # No go.sum exists — this module has zero external
          # dependencies (see go.mod) — see ci.yml's identical setting
          # for why this is needed instead.
          cache-dependency-path: go.mod

      - name: Locate fuzz corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target.pkg }}-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target.pkg }}-${{ matrix.target.name }}-

      # go test -fuzz, through a wrapper that passes (with a warning) only
      # the known "context deadline exceeded" harness quirk: a failure
      # with no failing input written, no panic and nothing else wrong.
      - name: go test -fuzz=${{ matrix.target.name }}
        run: .github/scripts/fuzz-target.sh '${{ matrix.target.pkg }}' '${{ matrix.target.name }}' 5m

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target.pkg }}-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target.name }}
          path: '**/testdata/fuzz/${{ matrix.target.name }}/'
          retention-days: 30

  # Nothing else alerts on a red nightly run, and it never runs against a
  # PR, so report each default-branch run on an issue labelled "fuzz":
  # open one (or comment on the open one) naming the failing targets and
  # how to reproduce them, and close it on the next run that passes. Runs
  # dispatched on other branches report nothing.
  alert:
    needs: fuzz
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to check out the script below
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Report on the fuzz issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.fuzz.result }}
        run: .github/scripts/fuzz-alert.sh "$RESULT"
